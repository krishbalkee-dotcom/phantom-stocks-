<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module - Phantom Stocks</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000000;
      color: #ffffff;
      min-height: 100vh;
      font-weight: 300;
    }

    /* Header */
    .header {
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(55, 65, 81, 0.3);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #9ca3af;
      text-decoration: none;
      font-size: 13px;
      font-weight: 300;
      transition: color 0.2s;
      border: 1px solid rgba(55, 65, 81, 0.5);
      padding: 8px 16px;
      border-radius: 6px;
    }

    .back-btn:hover {
      color: #ffffff;
      border-color: #a855f7;
    }

    .timer {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #9ca3af;
      font-size: 13px;
      font-weight: 300;
    }

    .timer-text {
      font-weight: 400;
      color: #f9fafb;
    }

    /* Container */
    .container {
      padding: 48px 32px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Module Header */
    .module-header {
      margin-bottom: 40px;
    }

    .module-number {
      color: #6b7280;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .module-title {
      font-size: 36px;
      font-weight: 400;
      margin-bottom: 16px;
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .module-meta {
      display: flex;
      gap: 20px;
      color: #6b7280;
      font-size: 13px;
      font-weight: 300;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Article Content */
    .article-content {
      background: #000000;
      border: 1px solid rgba(55, 65, 81, 0.3);
      border-radius: 8px;
      padding: 40px;
      margin-bottom: 32px;
      line-height: 1.8;
      font-size: 15px;
      color: #d1d5db;
    }

    .article-content h2 {
      color: #ffffff;
      font-size: 24px;
      font-weight: 400;
      margin: 32px 0 16px;
    }

    .article-content h3 {
      color: #ffffff;
      font-size: 18px;
      font-weight: 400;
      margin: 24px 0 12px;
    }

    .article-content p {
      margin-bottom: 16px;
      font-weight: 300;
    }

    .article-content ul,
    .article-content ol {
      margin: 16px 0 16px 24px;
    }

    .article-content li {
      margin-bottom: 8px;
      font-weight: 300;
    }

    .article-content strong {
      color: #ffffff;
      font-weight: 400;
    }

    .article-content code {
      background: rgba(168, 85, 247, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #a855f7;
      border: 1px solid rgba(168, 85, 247, 0.2);
    }

    .article-content blockquote {
      border-left: 3px solid #a855f7;
      padding-left: 20px;
      margin: 20px 0;
      font-style: italic;
      color: #9ca3af;
      font-weight: 300;
    }

    /* Complete Section */
    .complete-section {
      background: #000000;
      border: 1px solid rgba(55, 65, 81, 0.3);
      border-radius: 8px;
      padding: 32px;
    }

    .complete-message {
      font-size: 15px;
      color: #9ca3af;
      margin-bottom: 20px;
      font-weight: 300;
      text-align: center;
    }

    .complete-requirement {
      background: rgba(249, 115, 22, 0.1);
      border: 1px solid rgba(249, 115, 22, 0.3);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 24px;
      color: #f97316;
      font-size: 13px;
      font-weight: 300;
      text-align: center;
    }

    .complete-btn {
      width: 100%;
      padding: 14px 32px;
      background: transparent;
      border: 1px solid #a855f7;
      border-radius: 6px;
      color: #a855f7;
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .complete-btn:hover:not(:disabled) {
      background: rgba(168, 85, 247, 0.1);
    }

    .complete-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .complete-btn.completed {
      background: rgba(16, 185, 129, 0.1);
      border-color: #10b981;
      color: #10b981;
    }

    .success-message {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 6px;
      padding: 16px;
      margin-top: 20px;
      color: #10b981;
      display: none;
      text-align: center;
      font-size: 13px;
      font-weight: 300;
    }

    .success-message.show {
      display: block;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 100px 20px;
      color: #6b7280;
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 2px solid rgba(55, 65, 81, 0.3);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 32px 16px;
      }

      .module-title {
        font-size: 28px;
      }

      .article-content {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <a href="courses.html" class="back-btn" id="backBtn">
      <span>←</span>
      <span>Back to Courses</span>
    </a>
    <div class="timer">
      <span>Time:</span>
      <span class="timer-text" id="timerText">0:00</span>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading" id="loadingState">
    <div class="loading-spinner"></div>
    <div>Loading module...</div>
  </div>

  <!-- Container -->
  <div class="container" id="moduleContent" style="display: none;">
    <!-- Module Header -->
    <div class="module-header">
      <div class="module-number" id="moduleNumber">MODULE 1</div>
      <h1 class="module-title" id="moduleTitle">Loading...</h1>
      <div class="module-meta">
        <div class="meta-item">
          <span id="moduleDuration">~10 min read</span>
        </div>
      </div>
    </div>

    <!-- Article Content -->
    <div class="article-content" id="articleContent">
      <!-- Content will be loaded dynamically -->
    </div>

    <!-- Complete Section -->
    <div class="complete-section">
      <div class="complete-message">
        You've reached the end of this module.
      </div>
      <div class="complete-requirement" id="requirementMessage">
        Spend at least 10 minutes on this page to complete the module
      </div>
      <button class="complete-btn" id="completeBtn" disabled>
        Complete Module
      </button>
      <div class="success-message" id="successMessage">
        Module completed! Moving to next module...
      </div>
    </div>
  </div>

  <script type="module" src="./src/pages/module.js"></script>
</body>
</html>
