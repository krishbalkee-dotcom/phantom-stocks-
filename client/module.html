<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module - Phantom Stocks</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #9ca3af;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s;
    }

    .back-btn:hover {
      color: #ffffff;
    }

    .timer {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #9ca3af;
      font-size: 14px;
    }

    .timer-icon {
      font-size: 16px;
    }

    .timer-text {
      font-weight: 500;
    }

    /* Container */
    .container {
      padding: 48px 32px;
      max-width: 800px;
      margin: 0 auto;
    }

    /* Module Header */
    .module-header {
      margin-bottom: 48px;
      text-align: center;
    }

    .module-number {
      color: #9333ea;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .module-title {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .module-meta {
      display: flex;
      justify-content: center;
      gap: 24px;
      color: #9ca3af;
      font-size: 14px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Article Content */
    .article-content {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 48px;
      margin-bottom: 32px;
      line-height: 1.8;
      font-size: 16px;
      color: #d1d5db;
    }

    .article-content h2 {
      color: #ffffff;
      font-size: 28px;
      margin: 40px 0 16px;
    }

    .article-content h3 {
      color: #ffffff;
      font-size: 22px;
      margin: 32px 0 12px;
    }

    .article-content p {
      margin-bottom: 16px;
    }

    .article-content ul,
    .article-content ol {
      margin: 16px 0 16px 32px;
    }

    .article-content li {
      margin-bottom: 8px;
    }

    .article-content strong {
      color: #ffffff;
      font-weight: 600;
    }

    .article-content code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: #fcd34d;
    }

    .article-content blockquote {
      border-left: 4px solid #9333ea;
      padding-left: 20px;
      margin: 24px 0;
      font-style: italic;
      color: #9ca3af;
    }

    /* Complete Section */
    .complete-section {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 32px;
      text-align: center;
    }

    .complete-message {
      font-size: 18px;
      color: #9ca3af;
      margin-bottom: 24px;
    }

    .complete-requirement {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      color: #fcd34d;
      font-size: 14px;
    }

    .complete-btn {
      padding: 16px 48px;
      background: linear-gradient(135deg, #ef4444 0%, #9333ea 100%);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .complete-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(147, 51, 234, 0.4);
    }

    .complete-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .complete-btn.completed {
      background: #10b981;
    }

    .success-message {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 8px;
      padding: 16px;
      margin-top: 20px;
      color: #6ee7b7;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 100px 20px;
      color: #9ca3af;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #9333ea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <a href="courses.html" class="back-btn" id="backBtn">
      <span>←</span>
      <span>Back to Courses</span>
    </a>
    <div class="timer">
      <span class="timer-icon">⏱️</span>
      <span class="timer-text" id="timerText">0:00</span>
    </div>
  </div>

  <!-- Loading -->
  <div class="loading" id="loadingState">
    <div class="loading-spinner"></div>
    <div>Loading module...</div>
  </div>

  <!-- Container -->
  <div class="container" id="moduleContent" style="display: none;">
    <!-- Module Header -->
    <div class="module-header">
      <div class="module-number" id="moduleNumber">MODULE 1</div>
      <h1 class="module-title" id="moduleTitle">Loading...</h1>
      <div class="module-meta">
        <div class="meta-item">
          <span>📚</span>
          <span id="moduleDuration">~10 min read</span>
        </div>
      </div>
    </div>

    <!-- Article Content -->
    <div class="article-content" id="articleContent">
      <!-- Content will be loaded dynamically -->
    </div>

    <!-- Complete Section -->
    <div class="complete-section">
      <div class="complete-message">
        Great job! You've reached the end of this module.
      </div>
      <div class="complete-requirement" id="requirementMessage">
        ⏱️ Spend at least 10 minutes on this page to complete the module
      </div>
      <button class="complete-btn" id="completeBtn" disabled>
        Complete Module
      </button>
      <div class="success-message" id="successMessage">
        ✓ Module completed! Moving to next module...
      </div>
    </div>
  </div>

  <script type="module" src="./src/pages/module.js"></script>
</body>
</html>
